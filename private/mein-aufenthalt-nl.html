<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex,nofollow">
  <title>Mijn verblijf | ME LIVING Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/mein-aufenthalt.css?v=6.2">
</head>
<body>
<div class="private-page">
  <header class="private-header">
    <a href="../index.html"><img class="private-logo" src="../assets/images/logo/ME_LIVING_logo_v5_transparent.png?v=6" alt="ME LIVING Apartments"></a>
    <a class="back-link" href="../nl/brunnenstrasse.html">Terug naar de gids</a>
  </header>
  <main class="private-main">
    <section class="login-card">
      <div class="lock-icon">🔒</div>
      <div class="eyebrow">Mijn verblijf</div>
      <h1>Welkom terug.</h1>
      <p class="intro">Meld u aan met de gegevens die bij uw boeking zijn opgeslagen.</p>
      <form class="login-form" data-login-form novalidate>
        <div class="field">
          <label for="surname">Achternaam</label>
          <input id="surname" name="surname" type="text" autocomplete="family-name" placeholder="Bijvoorbeeld De Vries" required>
        </div>
        <div class="field">
          <label for="postal-code">Postcode</label>
          <input id="postal-code" name="postalCode" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="5" placeholder="12345" required>
        </div>
        <button class="submit-button" type="submit">Gastgedeelte openen</button>
        <p class="form-message" data-form-message role="alert" aria-live="polite"></p>
      </form>
      <p class="privacy-note">Uw invoer wordt uitsluitend gebruikt voor de veilige vrijgave van uw persoonlijke gastgedeelte.</p>
      
    </section>
  </main>
  <footer class="private-footer">
    <img src="../assets/images/logo/ME_LIVING_logo_v5_transparent.png?v=6" alt="ME LIVING Apartments">
    <p>ME LIVING · Ankommen. Wohlfühlen. Zuhause sein.</p>
  </footer>
</div>
<script src="../assets/js/mein-aufenthalt.js?v=6.5" defer></script>
</body>
</html>
